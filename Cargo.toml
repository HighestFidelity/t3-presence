[package]
name = "t3presence"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Discord Rich Presence for T3 Code"

[[bin]]
name = "T3Presence"
path = "src/main.rs"

[features]
# dev: separate mutex/event names and no autostart rewrite, so it can sit next to the C# app.
dev = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
base64 = "0.22"
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.29", features = ["image", "http"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_Security", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_System_IO", "Win32_UI_Shell", "Win32_System_LibraryLoader", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1
      - name: Checksum
        shell: powershell
        run: (Get-FileHash T3Presence.exe -Algorithm SHA256).Hash.ToLower() + "  T3Presence.exe" | Out-File -Encoding ascii T3Presence.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: T3Presence
          path: |
            T3Presence.exe
            T3Presence.exe.sha256
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            T3Presence.exe
            T3Presence.exe.sha256
          generate_release_notes: true
